    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const APP_NAME_PLACEHOLDER = '[APP_NAME_PLACEHOLDER]';
            const body = document.body;
            
            // 1. Fetch the small configuration file
            fetch('JSON/app_config.json')
                .then(response => response.json())
                .then(config => {
                    
                    // --- NEW: UPDATE TAB TITLE ---
                    // This sets the tab to "AppName - ScreenName"
                    if (config.text && config.text.appName) {
                        document.title = document.title.replace(APP_NAME_PLACEHOLDER, config.text.appName);
                    } else {
                        // If no app name exists, just remove the placeholder
                        document.title = document.title.replace(APP_NAME_PLACEHOLDER, 'App');
                    }

                    // 2. Apply Theme (CSS Variables)
                    const root = document.documentElement;
                    console.log(config);
                    root.style.setProperty('--primary-color', config.theme.primaryColor);
                    root.style.setProperty('--font-family', config.theme.fontFamily);
                    
                    if (config.theme.colorScheme === 'Dark') {
                        root.style.setProperty('--bg-color', '#333333');
                        root.style.setProperty('--text-color', '#ffffff');
                    } else {
                    // Added else case to ensure colors are set correctly for Light mode (as per previous guidance)
                    root.style.setProperty('--bg-color', '#f4f4f4');
                    root.style.setProperty('--text-color', '#333333');
                }

                    // 3. Apply Text Content (DOM Manipulation)
                    // Example: Update the page title or header if elements exist
                    const headerTitle = document.getElementById('HEADER_TITLE');
                    if (headerTitle) headerTitle.textContent = config.text.communityName;


                    const logoImage = document.getElementById('APP_LOGO_IMAGE');
                    if (logoImage && config.theme.logoUrl) {
                        logoImage.src = config.theme.logoUrl;
                        logoImage.alt = config.text.appName + " Logo";
                    }

                    if (config.theme.backgroundImage) {
                        body.style.backgroundImage = `url('${config.theme.backgroundImage}')`;
                    }
                
                    const fileInputs = document.querySelectorAll('input[type="file"]');
                    fileInputs.forEach(input => {
                        // Logic handled here instead of Jinja
                        if (config.constraints.maxPhotos) {
                            input.setAttribute('data-max', config.constraints.maxPhotos);
                        }
                    });

                    // 5. Reveal the page
                    document.body.classList.remove('loading');
                })
                .catch(err => console.error('Error loading config:', err));
        });
    </script>
